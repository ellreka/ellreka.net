name: OGP images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: すべての OGP 画像を撮り直す
        type: boolean
        default: false

concurrency:
  group: og-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        shell: bash
        run: |
          pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"
          # Void は prerender が失敗しても exit 0 になるため、ログも確認する
          ! grep -E '\[void\].*(prerender .* failed|failed to prerender)' \
            "$RUNNER_TEMP/build.log"
      - name: Generate and upload OGP images
        env:
          FORCE_OG: ${{ inputs.force && 'true' || 'false' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN を設定してください}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID を設定してください}"
          if [ "$FORCE_OG" = "true" ]; then
            pnpm og:generate --force
          else
            pnpm og:generate
          fi
